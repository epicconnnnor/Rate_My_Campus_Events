name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No database, no API key, no network. These are the tests that gate a PR.
      - name: Unit tests
        run: pytest app/test -v --ignore=app/test/test_hallucinations.py

  hallucinations:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Not the stock postgres image -- the schema needs the vector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_USER: app
      DATABASE_PASS: app
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: eval
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional override. Unset arrives here as an empty string and the
      # default in app/core/config.py applies, which is already a different
      # model from CHAT_MODEL and so a separate daily quota.
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      # Only a fork's pull request is allowed to skip: it cannot read the
      # repository's secrets. A push or a same-repo pull request that finds
      # no key fails, rather than going green having judged nothing.
      EVAL_REQUIRE_LIVE_MODEL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate
        run: alembic upgrade head

      # Printed as its own step so the model ids are in the job log whatever
      # the tests do. Inside pytest they are captured at INFO and only surface
      # on failure, which is exactly when they were missing last time.
      - name: Resolved models
        run: |
          python -c "
          import logging, sys
          logging.basicConfig(level=logging.INFO, format='%(message)s', stream=sys.stdout)
          from app.rag.providers import announce_models
          announce_models()
          "

      - name: Judge the golden questions
        run: pytest app/test/test_hallucinations.py -v
