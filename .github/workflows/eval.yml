name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No database, no API key, no network. These are the tests that gate a PR.
      - name: Unit tests
        run: pytest app/test -v --ignore=app/test/test_hallucinations.py

  hallucinations:
    runs-on: ubuntu-latest

    # Only when somebody asks for it. Not on a commit, not on a timer.
    #
    # It spends a shared daily quota and waits on a model that is sometimes
    # busy, so a green tick here is a statement about Google's afternoon as
    # much as about the diff. Fifteen minutes and a slice of a 500-a-day budget
    # is the wrong toll to charge every push, and a judge that fails for
    # capacity teaches people to ignore a red tick -- which costs more than
    # running it less often. A nightly cron spends the same budget on a night
    # when nobody asked a question, so that went too.
    #
    # The unit job above still runs on every push and pull request. That is the
    # one that gates a change.
    #
    # One `if`, and it stays one: a second copy of this key is a workflow file
    # GitHub refuses to parse, which fails every run in zero seconds with the
    # workflow named after its own path.
    if: github.event_name == 'workflow_dispatch'

    # And once it does start, an end. The default is 360 minutes, which is not
    # a limit so much as an afternoon. This job waits on purpose -- a quota
    # window is a minute, and a busy model is worth up to eight minutes of
    # backoff per call -- so a bad day adds up honestly rather than hanging.
    # 45 is well clear of a normal run, which is about twelve, and still fails
    # the same night.
    timeout-minutes: 45

    services:
      postgres:
        # Not the stock postgres image -- the schema needs the vector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_USER: app
      DATABASE_PASS: app
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: eval
      # Both, so RAG_PROVIDER decides which one matters rather than the
      # workflow. An unset secret arrives as an empty string, which the
      # live-model gate reads as absent.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_PROVIDER: ${{ vars.RAG_PROVIDER }}
      EMBEDDING_CACHE_PATH: app/test/fixtures/.embeddings
      # Optional override. Unset arrives here as an empty string and the
      # default in app/core/config.py applies, which is already a different
      # model from CHAT_MODEL and so a separate daily quota.
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
      # Only a fork's pull request is allowed to skip: it cannot read the
      # repository's secrets. A push or a same-repo pull request that finds
      # no key fails, rather than going green having judged nothing.
      #
      # This job no longer runs on pull_request at all, so the expression is
      # true every time it is evaluated. Kept rather than folded to `true` so
      # that putting the trigger back does not silently hand forks a green
      # tick for having judged nothing.
      EVAL_REQUIRE_LIVE_MODEL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      # The frozen events do not change, so neither do their vectors. Without
      # this, every run spent 102 of the day's 1000 free embedding requests
      # recomputing the same 102 documents.
      #
      # Restore and save are separate on purpose. The combined action saves
      # only when the job succeeded, and a failing judge is the case where the
      # next run is soonest -- exactly when throwing the vectors away hurts.
      #
      # The key ends in the run id so it can never hit exactly, which means
      # every run writes back whatever it learned: a new golden question, an
      # edited event. restore-keys reads the newest matching cache instead,
      # most specific first.
      - name: Restore the embedding cache
        id: embedding-cache
        uses: actions/cache/restore@v4
        with:
          path: app/test/fixtures/.embeddings
          key: embeddings-${{ hashFiles('app/test/fixtures/events.json') }}-${{ github.run_id }}
          restore-keys: |
            embeddings-${{ hashFiles('app/test/fixtures/events.json') }}-
            embeddings-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate
        run: alembic upgrade head

      # Printed as its own step so the model ids are in the job log whatever
      # the tests do. Inside pytest they are captured at INFO and only surface
      # on failure, which is exactly when they were missing last time.
      - name: Resolved models
        run: |
          python -c "
          import logging, sys
          logging.basicConfig(level=logging.INFO, format='%(message)s', stream=sys.stdout)
          from app.rag.providers import announce_models
          announce_models()
          "

      - name: Judge the golden questions
        run: pytest app/test/test_hallucinations.py -v

      # Whatever happened above, the vectors it computed are still correct and
      # still worth not paying for twice.
      - name: Save the embedding cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/test/fixtures/.embeddings
          key: ${{ steps.embedding-cache.outputs.cache-primary-key }}
