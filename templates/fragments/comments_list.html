{% if comments %}
{% for comment in comments %}
<div class="comment">
    <div class="comment-header">
        <div class="comment-author">{{ comment.user_name }}</div>
        <div class="comment-date">{{ comment.created_at }}</div>
    </div>
    <div class="comment-text">{{ comment.text }}</div>
    {% if user and user.user_id == comment.user_id %}
    <button
        class="delete-comment-btn"
        hx-delete="/htmx/comment/{{ comment.comment_id }}"
        hx-target="#comments-list"
        hx-swap="innerHTML"
        hx-confirm="Are you sure you want to delete this comment?"
        style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 8px;">
        Delete
    </button>
    {% endif %}
</div>
{% endfor %}
{% else %}
<p style="text-align: center; color: #7f8c8d; padding: 40px;">
    No comments yet. Be the first to comment!
</p>
{% endif %}
